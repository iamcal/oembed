; PHP settings for oembed.com, read by PHP-FPM. Each [PATH=] section applies to the scripts in
; that directory and below (deeper ones last), as php_value in site.conf or .htaccess did under
; mod_php. Linked into /etc/php/8.3/fpm/conf.d as site-oembed.com.ini; after a change, `sudo
; systemctl reload php8.3-fpm`. See neuron7.md in /mnt/neuron-base, "Event MPM and PHP-FPM".

[PATH=/var/www/html/oembed.com/www]
; moved here from site.conf on 2026-11-16
display_errors = 1
error_reporting = 32767
